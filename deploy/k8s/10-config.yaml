apiVersion: v1
kind: ConfigMap
metadata:
  name: ma-pmo-config
  namespace: ma-pmo
data:
  # LLM gateway — in-cluster Ollama service (recommended) or an external endpoint
  LLM_MODEL: "ollama_chat/llama3.1:8b"
  LLM_MODEL_FAST: "ollama_chat/llama3.1:8b"
  LLM_API_BASE: "http://ollama.ma-pmo.svc.cluster.local:11434"
  # data: Postgres (same namespace)
  DB_URL: "postgresql+psycopg://mapmo:mapmo@postgres.ma-pmo.svc.cluster.local:5432/mapmo"
  CHECKPOINT_DB: "/app/data/ma_pmo_checkpoints.sqlite"
  HITL_CONFIDENCE_THRESHOLD: "0.6"
---
apiVersion: v1
kind: Secret
metadata:
  name: ma-pmo-secrets
  namespace: ma-pmo
type: Opaque
stringData:
  # fill only when using Anthropic (leave empty in Ollama mode)
  ANTHROPIC_API_KEY: ""

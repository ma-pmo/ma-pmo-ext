apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data-pvc
  namespace: ma-pmo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ma-pmo
  labels: { app: ma-pmo-api }
spec:
  replicas: 1  # LangGraph SQLite checkpointer -> single replica. Scaling out needs the Postgres checkpointer
  selector:
    matchLabels: { app: ma-pmo-api }
  template:
    metadata:
      labels: { app: ma-pmo-api }
    spec:
      containers:
        - name: api
          image: ma-pmo/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ma-pmo-config }
            - secretRef: { name: ma-pmo-secrets }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: api-data-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ma-pmo
spec:
  selector: { app: ma-pmo-api }
  ports:
    - port: 8000
      targetPort: 8000

    <g transform="translate(386 168)"><circle r="40" fill="#FFC857"/><circle cx="-12" cy="-4" r="6" fill="#3A2A2A"/><circle cx="12" cy="-4" r="6" fill="#3A2A2A"/><path d="M-9 11 q9 8 18 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(410 308)"><circle r="40" fill="#7ED6A7"/><path d="M-18 -4 q6 -7 12 0 M6 -4 q6 -7 12 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-9 11 q9 8 18 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(326 412)"><circle r="40" fill="#B39DDB"/><circle cx="-12" cy="-4" r="6" fill="#3A2A2A"/><circle cx="12" cy="-4" r="6" fill="#3A2A2A"/><ellipse cy="13" rx="7" ry="5" fill="#3A2A2A"/></g>
    <g transform="translate(186 412)"><circle r="40" fill="#4FC3F7"/><circle cx="-12" cy="-4" r="6" fill="#3A2A2A"/><circle cx="12" cy="-4" r="6" fill="#3A2A2A"/><path d="M-9 11 q9 8 18 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(102 308)"><circle r="40" fill="#F48FB1"/><circle cx="-12" cy="-4" r="6" fill="#3A2A2A"/><path d="M6 -4 q6 -7 12 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-9 11 q9 8 18 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(126 168)"><circle r="40" fill="#A5D6A7"/><circle cx="-12" cy="-4" r="6" fill="#3A2A2A"/><circle cx="12" cy="-4" r="6" fill="#3A2A2A"/><path d="M-9 11 q9 8 18 0" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/></g>

    <line x1="290" y1="138" x2="352" y2="152"/><line x1="404" y1="206" x2="412" y2="268"/><line x1="392" y1="342" x2="356" y2="384"/>
    <line x1="286" y1="420" x2="226" y2="420"/><line x1="156" y1="384" x2="120" y2="342"/><line x1="100" y1="268" x2="108" y2="206"/><line x1="160" y1="152" x2="222" y2="138"/>

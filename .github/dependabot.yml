version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # major upgrades (e.g. Next 14 -> 16, React 18 -> 19) need manual migration; review them by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # major upgrades (e.g. Next 14 -> 16, React 18 -> 19) need manual migration; review them by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # the image follows the Python version CI tests, and new versions wait for dependency
      # wheels (Python 3.15: tiktoken has none yet); raise CI and the Dockerfile together
      - dependency-name: "python"

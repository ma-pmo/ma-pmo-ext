name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra otel

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy ma_pmo

      - name: Smoke tests
        run: uv run pytest -q -m smoke

      - name: Regression tests
        run: uv run pytest -q -m regression

      - name: Full test suite
        run: uv run pytest -q

      - name: Example agent plugin, installed as a separate package
        run: |
          uv pip install --no-deps ./examples/agent-plugin
          uv run --no-sync pytest -q examples/agent-plugin
          uv run --no-sync ma-pmo agents

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mapmo
          POSTGRES_PASSWORD: mapmo
          POSTGRES_DB: mapmo_test
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # an ordinary role that owns the database: superusers would skip row-level security
      TEST_DB_URL: postgresql+psycopg://mapmo_app:mapmo_app@localhost:5432/mapmo_app_test
      PGTZ: Asia/Seoul  # timestamps must stay UTC whatever the session default is
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra otel --extra postgres

      - name: Create the ordinary role the app connects as
        env:
          PGPASSWORD: mapmo
        run: |
          psql -h localhost -U mapmo -d mapmo_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE mapmo_app LOGIN CREATEDB NOSUPERUSER PASSWORD 'mapmo_app'" \
            -c "CREATE DATABASE mapmo_app_test OWNER mapmo_app"

      - name: Full test suite on Postgres
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -t ma-pmo-api .

      - name: Start it and wait for /health
        run: |
          docker run -d --name api -p 8000:8000 ma-pmo-api
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Run it on the compose Postgres, as an ordinary role
        run: |
          docker compose --profile postgres up -d postgres
          for i in $(seq 1 30); do
            # over TCP: the image's first, setup-only server listens on the socket alone
            ready=$(docker compose exec -T -e PGPASSWORD=postgres postgres \
              psql -h 127.0.0.1 -U postgres -tAc \
              "SELECT rolsuper FROM pg_roles WHERE rolname = 'mapmo'" 2>/dev/null || true)
            [ "$ready" = "f" ] && break
            sleep 2
          done
          [ "$ready" = "f" ] || { docker compose logs postgres; exit 1; }
          network=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' \
            "$(docker compose ps -q postgres)")
          docker run -d --name api-pg --network "$network" -p 8001:8000 \
            -e DB_URL=postgresql+psycopg://mapmo:mapmo@postgres:5432/mapmo ma-pmo-api
          for i in $(seq 1 30); do
            curl -sf localhost:8001/health && break
            sleep 2
          done
          curl -sf localhost:8001/allocate -X POST > /dev/null
          test "$(curl -sf localhost:8001/allocations | python3 -c 'import json,sys; print(len(json.load(sys.stdin)) > 0)')" = True \
            || { docker logs api-pg; exit 1; }
          # without a workspace the database shows the app role nothing
          test "$(docker compose exec -T postgres psql -U mapmo -d mapmo -tAc 'SELECT COUNT(*) FROM project')" = 0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  layout:
    # Opens every dashboard page at phone, tablet, laptop and desktop sizes, in both languages
    # and both themes, and fails on anything that sticks out, gets cut off or is too small to tap.
    runs-on: ubuntu-latest
    env:
      DB_URL: sqlite:///layout.db
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync
          npm ci --prefix apps/web

      - name: Start the API with demo data and sample history
        run: |
          uv run ma-pmo init-db
          uv run python docs/capture_seed.py
          nohup uv run ma-pmo serve --port 8000 > api.log 2>&1 &

      - name: Build and start the dashboard
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: |
          npm run build
          nohup npm run start -- -p 3000 > ../../web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          cat ../../api.log ../../web.log; exit 1

      - name: Check the layout
        working-directory: apps/web
        run: node tests/layout.mjs --out layout-report.json

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-report
          path: |
            apps/web/layout-report.json
            api.log
            web.log

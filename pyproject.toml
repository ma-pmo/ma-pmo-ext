[project]
name = "ma-pmo"
version = "0.1.0"
description = "MA-PMO: LLM-backed supervisor-worker multi-agent PMO orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
keywords = ["multi-agent", "llm", "pmo", "project-management", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "myeongjin.ji", email = "mjinttt@gmail.com" }]
maintainers = [{ name = "myeongjin.ji", email = "mjinttt@gmail.com" }]

dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.55",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ma-pmo/ma-pmo-ext"
Documentation = "https://github.com/ma-pmo/ma-pmo-ext#readme"
Repository = "https://github.com/ma-pmo/ma-pmo-ext"
Issues = "https://github.com/ma-pmo/ma-pmo-ext/issues"
Changelog = "https://github.com/ma-pmo/ma-pmo-ext/blob/main/CHANGELOG.md"
"Commercial License" = "https://github.com/ma-pmo/ma-pmo-ext/blob/main/COMMERCIAL_LICENSE.md"

[project.scripts]
ma-pmo = "ma_pmo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]
# for production Postgres — needed when DB_URL=postgresql+psycopg://...
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ma_pmo"]

[tool.hatch.build.targets.sdist]
include = [
    "ma_pmo",
    "tests",
    "README.md",
    "README.ko.md",
    "LICENSE",
    "NOTICE",
    "COMMERCIAL_LICENSE.md",
    "TRADEMARKS.md",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum kept for JSON/Pydantic serialization compat instead of enum.StrEnum
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# bilingual scenario catalog: one (English, Korean) pair per line reads better than wrapping
"ma_pmo/core/scenarios.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
